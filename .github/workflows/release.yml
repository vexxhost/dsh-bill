# Publish to npm via trusted publishing (OIDC) — no long-lived token.
#
# Configure the trusted publisher once at
# https://www.npmjs.com/package/dsh-bill/access with:
#   Organization or user: Jannchie
#   Repository:           dsh-bill
#   Workflow filename:    release.yml     <- this file's name, not its path
#   Environment:          (leave empty)
#   Allowed actions:      npm publish
#
# Release by pushing a tag that matches the version in package.json:
#   npm version patch && git push --follow-tags

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  # Lets the runner mint the OIDC token npm exchanges for publish rights.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Trusted publishing needs Node >= 22.14.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # ...and npm >= 11.5.1, which is newer than what the runner ships.
      - run: npm install -g npm@latest

      # `npm ci` over `npm install`: it installs exactly the committed
      # lockfile and fails loudly if the two ever disagree.
      - run: npm ci --no-audit --no-fund

      # A tag that disagrees with package.json publishes a version nobody
      # asked for, under a tag pointing at different code. Fail loudly.
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json version $pkg"
            exit 1
          fi

      # prepublishOnly runs the syntax check and the full test suite, so a
      # broken commit cannot reach the registry.
      #
      # `npm publish` (not `pnpm publish`) because OIDC trusted publishing
      # lives in the npm CLI. Provenance is attested automatically for a
      # public package from a public repo.
      - run: npm publish
